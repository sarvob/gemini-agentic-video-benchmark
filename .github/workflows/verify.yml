name: Verify benchmark evidence

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean-clone verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public evidence
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Run the clean-clone reproduction
        run: ./scripts/verify-clean-clone.sh
