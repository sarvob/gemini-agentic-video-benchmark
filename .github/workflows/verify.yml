name: Verify benchmark evidence

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Clean-clone verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out public evidence
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify deterministic dataset manifests
        run: |
          npm run build:huggingface
          git diff --exit-code -- huggingface/data

      - name: Verify committed benchmark evidence
        run: npm run verify
